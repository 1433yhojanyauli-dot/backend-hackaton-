
spring.application.name=GeoFastPe
server.port=8080

# =====================================
# BASE DE DATOS (H2 para desarrollo)
# Para usar MySQL: --spring.profiles.active=mysql
# =====================================
spring.datasource.url=jdbc:h2:file:./data/geofastpe;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

# =====================================
# JPA / HIBERNATE
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 (desarrollo): http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Health check (usado por Render y por el monitor de sueno)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# =====================================
# JWT
# =====================================
app.jwt.secret=geofastpe-dev-secret-change-me-please-32bytes-min
app.jwt.expiration-ms=86400000

# =====================================
# ASISTENTE IA (LLM compatible con OpenAI)
# Por defecto usa Groq (gratis, con clave gratuita en https://console.groq.com/keys).
# Define ASSISTANT_LLM_API_KEY para activarlo. Sin clave, el frontend usa el motor local.
# Si el servicio falla o llega al limite, el frontend usa el motor local automaticamente.
# =====================================
app.assistant.base-url=${ASSISTANT_LLM_BASE_URL:https://api.groq.com/openai/v1}
app.assistant.api-key=${ASSISTANT_LLM_API_KEY:}
app.assistant.model=${ASSISTANT_LLM_MODEL:openai/gpt-oss-120b}

# =====================================
# CORS
# =====================================
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:4200,http://127.0.0.1:4200

# =====================================
# ARCHIVOS
# =====================================
app.storage.upload-dir=uploads
app.storage.max-file-size-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# =====================================
# SERVICIOS GEOGRAFICOS
# =====================================
app.geo.nominatim-base-url=https://nominatim.openstreetmap.org
app.geo.open-meteo-base-url=https://api.open-meteo.com
app.geo.routing-base-url=https://routing.openstreetmap.de
app.geo.user-agent=GeoFastPe/1.0 (proyecto academico)
