# =====================================
# PERFIL DE PRODUCCION (Render + PostgreSQL de Neon)
# Activar con: SPRING_PROFILES_ACTIVE=prod
# Todas las claves sensibles vienen de variables de entorno.
# Si falta una, el backend no arranca (es lo esperado).
# =====================================
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Render no conserva archivos entre reinicios en el plan gratuito.
app.storage.upload-dir=${UPLOAD_DIR:/tmp/geofastpe-uploads}

app.assistant.base-url=${ASSISTANT_LLM_BASE_URL:https://api.groq.com/openai/v1}
app.assistant.api-key=${ASSISTANT_LLM_API_KEY:}
app.assistant.model=${ASSISTANT_LLM_MODEL:openai/gpt-oss-120b}

# Documentacion de la API desactivada en produccion.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
